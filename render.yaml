databases:
  - name: stopdown-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: stopdown
    user: stopdown
    ipAllowList: []

services:
  - type: web
    name: stopdown-loans
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stopdown-db
          property: connectionString
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: ARC_CHAIN_ID
        value: "5042002"
      - key: LOAN_POSITION_TOKEN_ADDRESS
        value: 0x2a26829b172243b7d108f4bfcdea6d221179e0e7
      - key: OUTCOME_TOKEN_ADDRESS
        value: 0xf5d790f3caed7933c34a24f75582c3d15994e1ec
      - key: OUTCOME_EXCHANGE_ADDRESS
        value: 0x50ae818b42e6c82693cee5fae27ade7f5d4de43b
      - key: LOAN_POSITION_TOKEN_BYTECODE_HASH
        value: 0x14449393f7ce2ef787ca799fb0611830a5073ce0ec6556b704f922882b9f2bff
      - key: OUTCOME_TOKEN_BYTECODE_HASH
        value: 0x7107ae972858907ba5ecd3b6dd7cb0b5c2d06d07b8b6c054810245a0c4765fa1
      - key: OUTCOME_EXCHANGE_BYTECODE_HASH
        value: 0xc7a94ebb3e83bccb806ee99054d52cc0e8902592ee79950fb124f8355844bdfe
      - key: USDC_ADDRESS
        value: 0x3600000000000000000000000000000000000000
      - key: EXECUTOR_PRIVATE_KEY
        sync: false
      - key: CIRCLE_API_KEY
        sync: false
      - key: CIRCLE_APP_ID
        sync: false
      - key: CIRCLE_GOOGLE_CLIENT_ID
        sync: false
      - key: CIRCLE_GOOGLE_REDIRECT_URI
        sync: false
      - key: CIRCLE_TRUST_PROXY
        value: "true"
      - key: CIRCLE_ACTION_RATE_LIMIT
        value: "30"
      - key: CIRCLE_ACTION_RATE_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_CLEANUP_INTERVAL_MS
        value: "600000"
      - key: RATE_LIMIT_CLEANUP_BATCH_LIMIT
        value: "1000"
      - key: CLOB_BACKGROUND_LOOPS
        value: "true"
      - key: RECONCILIATION_CONFIRMATION_DEPTH
        value: "1"
      - key: RECONCILIATION_INTERVAL_MS
        value: "5000"
      - key: RECONCILIATION_MAX_BLOCKS_PER_RUN
        value: "1000"
      - key: EXECUTOR_INTERVAL_MS
        value: "2000"
      - key: LENDING_KEEPER_INTERVAL_MS
        value: "10000"
      - key: LOAN_SNAPSHOT_SYNC_INTERVAL_MS
        value: "30000"
      - key: RECEIPT_SWEEP_INTERVAL_MS
        value: "5000"
      - key: EXPIRED_ORDER_SWEEP_INTERVAL_MS
        value: "10000"
      - key: MARKET_CONFIG_EVENT_SWEEP_INTERVAL_MS
        value: "5000"
      - key: PUBLIC_ARC_CHAIN_ID
        value: "5042002"
      - key: PUBLIC_ARC_CHAIN_NAME
        value: Arc Testnet
      - key: PUBLIC_ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: PUBLIC_ARC_EXPLORER_URL
        value: https://testnet.arcscan.app
      - key: PUBLIC_LOAN_POSITION_ADDRESS
        value: 0x2a26829b172243b7d108f4bfcdea6d221179e0e7
      - key: PUBLIC_OUTCOME_ADDRESS
        value: 0xf5d790f3caed7933c34a24f75582c3d15994e1ec
      - key: PUBLIC_EXCHANGE_ADDRESS
        value: 0x50ae818b42e6c82693cee5fae27ade7f5d4de43b
      - key: PUBLIC_USDC_ADDRESS
        value: 0x3600000000000000000000000000000000000000
