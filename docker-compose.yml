services:
  postgres:
    image: postgres:17-alpine
    container_name: stopdown-postgres
    environment:
      POSTGRES_DB: stopdown
      POSTGRES_USER: stopdown
      POSTGRES_PASSWORD: stopdown
    ports:
      - "55432:5432"
    volumes:
      - stopdown_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stopdown -d stopdown"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stopdown_postgres_data:
